{{- $_ := required "gitops.topology is required (platform, projects and output, GITOPS_CONFIG): the deployments repositories are the only desired-state store, the output in a repository of its own" (.Values.gitops.topology | default "") }}
{{- $topology := deepCopy .Values.gitops.topology }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "okdp-control-plane-server.fullname" . }}-topology
  labels:
    {{- include "okdp-control-plane-server.labels" . | nindent 4 }}
data:
  {{- if $topology.forgejo }}
  {{- $_ := set $topology.forgejo "tokenFile" "/etc/okdp/forgejo/token" }}
  {{- end }}
  topology.yaml: |
    {{- toYaml $topology | nindent 4 }}
