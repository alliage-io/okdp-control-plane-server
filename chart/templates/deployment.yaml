apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "okdp-control-plane-server.fullname" . }}
  labels:
    {{- include "okdp-control-plane-server.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "okdp-control-plane-server.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Environment variables only refresh on pod restart: roll the
        # Deployment whenever the ConfigMap content changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/topology: {{ include (print $.Template.BasePath "/topology.yaml") . | sha256sum }}
      labels:
        {{- include "okdp-control-plane-server.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "okdp-control-plane-server.fullname" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "okdp-control-plane-server.fullname" . }}
          {{- $kc := .Values.keycloak.credentialsSecret }}
          {{- $proxy := .Values.proxy }}
          {{- if or $kc.name $proxy.httpProxy $proxy.httpsProxy $proxy.noProxy }}
          env:
            {{- if $kc.name }}
            # Keycloak Admin API service account (user and group management).
            - name: KEYCLOAK_CLIENT_ID
              valueFrom:
                secretKeyRef: { name: {{ $kc.name | quote }}, key: {{ $kc.clientIdKey | default "client_id" | quote }} }
            - name: KEYCLOAK_CLIENT_SECRET
              valueFrom:
                secretKeyRef: { name: {{ $kc.name | quote }}, key: {{ $kc.clientSecretKey | default "client_secret" | quote }} }
            {{- end }}
            {{- with $proxy }}
            {{- if .httpProxy }}
            - { name: HTTP_PROXY,  value: {{ .httpProxy | quote }} }
            - { name: http_proxy,  value: {{ .httpProxy | quote }} }
            {{- end }}
            {{- if .httpsProxy }}
            - { name: HTTPS_PROXY, value: {{ .httpsProxy | quote }} }
            - { name: https_proxy, value: {{ .httpsProxy | quote }} }
            {{- end }}
            {{- if .noProxy }}
            - { name: NO_PROXY,    value: {{ .noProxy | quote }} }
            - { name: no_proxy,    value: {{ .noProxy | quote }} }
            {{- end }}
            {{- end }}
          {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
          volumeMounts:
            # The local clone of the deployments repository: a cache only,
            # Git is the store.
            - name: gitops-clone
              mountPath: /var/cache/okdp/gitops
            # The chart cache: the upstream charts of the compiled
            # instances, for the checks of a compile and the chart defaults.
            - name: chart-cache
              mountPath: {{ .Values.gitops.chartCacheDir }}
            # HOME of the image (Git and registry clients) and the temporary
            # directory: the root filesystem is read-only.
            - name: tmp
              mountPath: /tmp
            {{- if .Values.gitops.credentialsSecret }}
            - name: gitops-credentials
              mountPath: /etc/okdp/gitops-credentials
              readOnly: true
            {{- end }}
            {{- if .Values.gitops.topology }}
            - name: gitops-topology
              mountPath: /etc/okdp/gitops
              readOnly: true
            {{- end }}
            {{- if .Values.gitops.forgejoTokenSecret }}
            - name: forgejo-token
              mountPath: /etc/okdp/forgejo
              readOnly: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: gitops-clone
          emptyDir: {}
        - name: chart-cache
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        {{- if .Values.gitops.credentialsSecret }}
        - name: gitops-credentials
          secret:
            secretName: {{ .Values.gitops.credentialsSecret }}
            defaultMode: 0400
        {{- end }}
        {{- if .Values.gitops.topology }}
        - name: gitops-topology
          configMap:
            name: {{ include "okdp-control-plane-server.fullname" . }}-topology
        {{- end }}
        {{- if .Values.gitops.forgejoTokenSecret }}
        - name: forgejo-token
          secret:
            secretName: {{ .Values.gitops.forgejoTokenSecret }}
            defaultMode: 0400
            items:
              - key: token
                path: token
        {{- end }}
