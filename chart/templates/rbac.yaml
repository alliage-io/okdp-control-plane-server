{{- $name := include "okdp-control-plane-server.fullname" . }}
{{- $sa := printf "system:serviceaccount:%s:%s" .Release.Namespace $name }}
# The server's rights outside the projects' namespaces only. In each
# project's namespace its rights are the compiled output's: okdp-compiler
# writes there, when platform.yaml sets global.okdp.controlPlane.serviceAccount
# to this chart's ServiceAccount, the Role okdp-control-plane (Secrets by
# name, never listed; pods, their logs and metrics; events; volumes;
# SecretStores, ExternalSecrets, SparkApplications) and its RoleBinding.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "okdp-control-plane-server.labels" . | nindent 4 }}
rules:
  # The Namespace of a project the console creates, and deletes: only one
  # labelled okdp.io/project with its name (the ValidatingAdmissionPolicy
  # below, rbac.namespacePolicy).
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "create", "delete"]
  # The SparkApplication form reads the operator's CRD schema, that CRD only.
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    resourceNames: ["sparkapplications.sparkoperator.k8s.io"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "okdp-control-plane-server.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: {{ $name }}
  apiGroup: rbac.authorization.k8s.io
---
# The GitOps engine's objects, read only, in the engine's namespace: the
# render/sync status of each release. The server never writes them.
{{- $argocd := eq .Values.gitops.engine "argocd" }}
{{- $engineNamespace := $argocd | ternary .Values.gitops.argocdNamespace .Values.gitops.releasesNamespace }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}-engine
  namespace: {{ $engineNamespace }}
  labels:
    {{- include "okdp-control-plane-server.labels" . | nindent 4 }}
rules:
  - apiGroups: [{{ $argocd | ternary "argoproj.io" "helm.toolkit.fluxcd.io" | quote }}]
    resources: [{{ $argocd | ternary "applications" "helmreleases" | quote }}]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}-engine
  namespace: {{ $engineNamespace }}
  labels:
    {{- include "okdp-control-plane-server.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: {{ $name }}-engine
  apiGroup: rbac.authorization.k8s.io
{{- if .Values.rbac.namespacePolicy }}
---
# The server's ServiceAccount creates a Namespace only labelled
# okdp.io/project with its own name and a Pod Security level that is not
# privileged, and deletes only a Namespace so labelled: never kube-system,
# a platform namespace or anyone else's, whatever its ClusterRole allows.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}-namespaces
  labels:
    {{- include "okdp-control-plane-server.labels" . | nindent 4 }}
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "DELETE"]
        resources: ["namespaces"]
  matchConditions:
    - name: the-control-plane
      expression: request.userInfo.username == {{ $sa | quote }}
  variables:
    - name: ns
      expression: "request.operation == 'DELETE' ? oldObject : object"
  validations:
    - expression: >-
        has(variables.ns.metadata.labels) &&
        'okdp.io/project' in variables.ns.metadata.labels &&
        variables.ns.metadata.labels['okdp.io/project'] == variables.ns.metadata.name
      message: the control plane creates and deletes only the Namespace of a project, labelled okdp.io/project with its name
    - expression: >-
        request.operation == 'DELETE' ||
        (has(variables.ns.metadata.labels) &&
        'pod-security.kubernetes.io/enforce' in variables.ns.metadata.labels &&
        variables.ns.metadata.labels['pod-security.kubernetes.io/enforce'] != 'privileged')
      message: the control plane creates no privileged Namespace
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}-namespaces
  labels:
    {{- include "okdp-control-plane-server.labels" . | nindent 4 }}
spec:
  policyName: {{ $name }}-namespaces
  validationActions: [Deny]
{{- end }}
