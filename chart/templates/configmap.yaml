apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "okdp-control-plane-server.fullname" . }}
  labels:
    {{- include "okdp-control-plane-server.labels" . | nindent 4 }}
data:
  PORT: {{ .Values.service.port | quote }}
  PLATFORM_NAMESPACE: {{ .Values.configuration.platformNamespace | quote }}
  ALLOWED_ORIGINS: {{ .Values.configuration.allowedOrigins | quote }}
  LOG_LEVEL: {{ .Values.configuration.logLevel | quote }}
  # The claim of the caller's groups, which every permission is read with.
  OIDC_GROUPS_CLAIM: {{ .Values.oidc.groupsClaim | default "groups" | quote }}
  # Where the platform, the projects and the output live (gitops.topology).
  GITOPS_CONFIG: /etc/okdp/gitops/topology.yaml
  GITOPS_ENGINE: {{ .Values.gitops.engine | quote }}
  GITOPS_RELEASES_NAMESPACE: {{ .Values.gitops.releasesNamespace | quote }}
  ARGOCD_NAMESPACE: {{ .Values.gitops.argocdNamespace | quote }}
  GITOPS_AUTHOR_NAME: {{ .Values.gitops.author.name | quote }}
  GITOPS_AUTHOR_EMAIL: {{ .Values.gitops.author.email | quote }}
  GITOPS_CREDENTIALS_DIR: /etc/okdp/gitops-credentials
  GITOPS_CLONE_DIR: /var/cache/okdp/gitops
  GITOPS_CHART_CACHE_DIR: {{ .Values.gitops.chartCacheDir | quote }}
  {{- if .Values.gitops.sshInsecureIgnoreHostKey }}
  # Sandboxes only: any SSH host key is accepted.
  GITOPS_SSH_INSECURE_IGNORE_HOST_KEY: "true"
  {{- end }}
  {{- with .Values.gitops.insecureHTTPHosts }}
  # The hosts a credential goes to over http://, in clear.
  GITOPS_INSECURE_HTTP_HOSTS: {{ join "," . | quote }}
  {{- end }}
  {{- if .Values.configuration.insecureOciRegistries }}
  # Development sandboxes only: registry hosts reached over plain HTTP.
  INSECURE_OCI_REGISTRIES: {{ .Values.configuration.insecureOciRegistries | quote }}
  {{- end }}
  {{- with .Values.keycloak }}
  {{- if .url }}
  KEYCLOAK_URL: {{ .url | quote }}
  {{- end }}
  {{- if .realm }}
  KEYCLOAK_REALM: {{ .realm | quote }}
  {{- end }}
  {{- if .tlsInsecure }}
  # Sandboxes only: the Keycloak certificate is not checked.
  KEYCLOAK_TLS_INSECURE: "true"
  {{- end }}
  {{- end }}
  {{- with .Values.sqlEditor }}
  SQL_STATEMENT_TIMEOUT: {{ .statementTimeout | quote }}
  SQL_DEFAULT_ROWS: {{ .defaultRows | quote }}
  SQL_MAX_ROWS: {{ .maxRows | quote }}
  SQL_MAX_RESULT_BYTES: {{ .maxResultBytes | int64 | quote }}
  SQL_MAX_CONCURRENT_PER_USER: {{ .maxConcurrentPerUser | quote }}
  {{- if .allowedNetworks }}
  SQL_ALLOWED_NETWORKS: {{ join "," .allowedNetworks | quote }}
  {{- end }}
  {{- if .caBundleSecret }}
  # The platform's CA bundle (sqlEditor.caBundleSecret).
  SQL_CA_FILE: /etc/okdp/sql-ca/ca.crt
  {{- end }}
  {{- end }}
