replicaCount: 1

image:
  repository: quay.io/okdp/images/okdp-control-plane-server
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Rendered as environment variables (see internal/config/config.go).
configuration:
  platformNamespace: okdp-system
  # Single origin, set verbatim in the Access-Control-Allow-Origin header.
  allowedOrigins: https://okdp-ui.example.com
  logLevel: info
  # Comma-separated registry hosts to reach over plain HTTP (dev sandboxes
  # with a local registry). Leave empty in any real deployment.
  insecureOciRegistries: ""

# The verification of the console's tokens. Issuer and client come from the
# platform values (global.okdp.identity.oidc, else global.okdp.oidc).
oidc:
  # The claim of the token holding the caller's groups (OIDC_GROUPS_CLAIM), a
  # list of group names: Keycloak's groups mapper with "Full group path" off,
  # the names platform.yaml global.okdp.access.admins and project.yaml access
  # give. A dotted name is a nested claim.
  groupsClaim: groups

# The deployments Git repositories: the only desired-state store. The server
# commits the tree there (instances, connections, named claims, projects and
# the catalog); okdp-gitops, in the CI of the output repository, compiles it
# into the output (compiled/...), which the GitOps engine reconciles.
gitops:
  # Required: where each part of the tree lives (GITOPS_CONFIG, written to a
  # ConfigMap mounted at /etc/okdp/gitops/topology.yaml), the output always in
  # a repository of its own, never one of the sources':
  #   platform: {url: <git url>, branch: main, path: ""}
  #   projects: {url: <git url, may contain {project}>, branch: main, path: "projects/{project}"}
  #   output:   {url: <git url>, branch: main, path: ""}
  #   forgejo:  {url: http://forgejo-http.forgejo.svc.cluster.local:3000, owner: okdp}
  # io: the platform and the projects in one input repository (projects.path
  # "projects/{project}"); split: a repository per project ({project} in
  # projects.url). forgejo (split) creates the repository of a new project;
  # its tokenFile is set to the token of forgejoTokenSecret.
  topology: {}
  # A Secret of the release namespace with the Forgejo API token (key
  # token), mounted at /etc/okdp/forgejo/token.
  forgejoTokenSecret: ""
  # The chart cache (GITOPS_CHART_CACHE_DIR, an emptyDir): the upstream
  # charts of the compiled instances, pulled from their repositories.
  chartCacheDir: /var/cache/okdp/charts
  # flux or argocd: which objects carry the render/sync status.
  engine: flux
  # Namespace of the Flux HelmReleases and their values ConfigMaps.
  releasesNamespace: okdp-releases
  # Namespace of the Argo CD Applications (engine: argocd).
  argocdNamespace: argocd
  # Name of a Secret, in the release namespace, with write access to the
  # repositories of the sources and read access to the output's. Flux
  # GitRepository keys: username + password (a token as password) or
  # bearerToken for HTTPS; identity + known_hosts for SSH.
  credentialsSecret: ""
  # Accept any SSH host key. Sandboxes only.
  sshInsecureIgnoreHostKey: false
  # Hosts a credential (the repositories', the catalogs', the Forgejo
  # token) is sent to over http://, in clear (GITOPS_INSECURE_HTTP_HOSTS):
  # host names, or globs of them (path.Match), none by default, every
  # credential for an http:// URL refused. Name the exact hosts, e.g. a
  # sandbox's in-cluster Forgejo, forgejo-http.forgejo.svc.cluster.local;
  # a glob such as *.svc.cluster.local trusts every Service of the cluster.
  insecureHTTPHosts: []
  author:
    name: OKDP control plane
    email: okdp-control-plane@okdp.io

# Keycloak Admin REST API, backing user and group management
# (/api/v1/identity). The client is a confidential service account of the
# platform realm holding the roles view-users, query-users, manage-users and
# query-groups of the realm's management client (realm-management, or
# master-realm when the realm is master). Without credentialsSecret.name, user
# management is off (the identity routes answer 501 and /api/capabilities
# reports identity.userManagement: false).
keycloak:
  # Keycloak base URL (no /realms/...) and realm (KEYCLOAK_URL,
  # KEYCLOAK_REALM). Empty: taken from the platform OIDC issuer
  # (<url>/realms/<realm>).
  url: ""
  realm: ""
  # Secret, in the release namespace, with the service-account client
  # credentials (KEYCLOAK_CLIENT_ID, KEYCLOAK_CLIENT_SECRET). Same default keys
  # as global.okdp.identity.provisioning.keycloak.credentialsSecret.
  credentialsSecret:
    name: ""
    clientIdKey: client_id
    clientSecretKey: client_secret
  # Skip the certificate check of Keycloak. Sandboxes only
  # (KEYCLOAK_TLS_INSECURE; global.okdp.oidc.insecureSkipVerify also applies
  # when the URL comes from the platform issuer).
  tlsInsecure: false

# The SQL editor (POST /api/projects/:p/connections/:c/sql and
# .../services/:s/sql) and the connection tests (SQL_* variables).
sqlEditor:
  # A Secret of the release namespace holding the platform's CA bundle,
  # the one global.okdp.tls.caBundleSecret of the platform values names
  # (certs-bundle in the sandbox, written to every namespace by
  # trust-manager), mounted at /etc/okdp/sql-ca (SQL_CA_FILE). Database
  # certificates are verified against it and the system's CAs; empty: the
  # system's only.
  caBundleSecret: ""
  caBundleKey: ca.crt
  # Networks (CIDRs or addresses) the editor and the connection tests may
  # reach although they are loopback, link-local (169.254.0.0/16,
  # fe80::/10) or the Kubernetes API server, all refused otherwise.
  allowedNetworks: []
  # One statement's timeout (a Go duration), PostgreSQL's
  # statement_timeout too.
  statementTimeout: 2m
  # The row cap of a request that names none, and the largest it may ask.
  defaultRows: 1000
  maxRows: 10000
  # Past this size of a result's rows, the rest is dropped (truncated).
  maxResultBytes: 16777216
  # Statements one user runs at once; past it, 429.
  maxConcurrentPerUser: 2

# The SecretStores the console creates in the projects' namespaces. One of
# kubernetes auth authenticates as the ServiceAccount of the platform's
# secret store in the namespace (global.okdp.secrets.serviceAccount, which
# the compiled manifests create), with the audiences of its provider
# (global.okdp.secrets.provider.vault.auth.kubernetes.serviceAccountRef.
# audiences), and names the platform's Vault server
# (global.okdp.secrets.provider.vault.server) or one of allowedServers; the
# connection tests too, through the network of sqlEditor.allowedNetworks.
secretStores:
  # Vault (OpenBao) server URLs allowed beside the platform's.
  allowedServers: []

# The server's rights outside the projects' namespaces (chart/templates/
# rbac.yaml): Namespaces get, create, delete; the HelmReleases of
# gitops.releasesNamespace (flux) or the Applications of
# gitops.argocdNamespace (argocd), read only; the SparkApplication CRD. Its
# rights in each project's namespace are the compiled output's: set
# platform.yaml global.okdp.controlPlane.serviceAccount to this chart's
# ServiceAccount (helm's NOTES print it), or the server reads and writes
# nothing in the projects' namespaces.
rbac:
  # A ValidatingAdmissionPolicy (Kubernetes >= 1.30) letting the server's
  # ServiceAccount create only a Namespace labelled okdp.io/project with
  # its name and a Pod Security level that is not privileged, and delete
  # only a Namespace so labelled.
  namespacePolicy: true

service:
  type: ClusterIP
  port: 8093

resources: {}

# The server runs as nobody (the image's USER 65534) on a read-only root
# filesystem: it writes only to the Git clone (/var/cache/okdp/gitops) and
# /tmp (HOME), both emptyDirs.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  runAsGroup: 65534
  fsGroup: 65534
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: [ALL]

# Forward proxy the pod must go through to reach anything outside the cluster.
# Empty means no proxy, which is the case on any sandbox. Rendered as the three
# environment variables every HTTP client reads.
proxy:
  httpProxy: ""
  httpsProxy: ""
  noProxy: ""
