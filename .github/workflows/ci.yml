name: ci

# Pull request and branch CI: vet, test (make test) and govulncheck.

on:
  pull_request:
  push:
    branches: [main, no-kubocd]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOVULNCHECK_VERSION: v1.8.0   # needs Go 1.26 or later; go.mod is on 1.27 (okdp-compiler's)
  # go.mod replaces okdp-compiler and okdp-gitops with ../okdp-compiler and
  # ../okdp-gitops until they are published: the commits of OKDP/okdp-compiler
  # and OKDP/okdp-gitops the job builds with, full SHAs bumped by hand (the
  # same as build-image.yml's); their releases replace them, and the replaces
  # of go.mod with them.
  OKDP_COMPILER_REF: 94e7e2d6712854a09b95aec1caac22a4068714a3
  OKDP_GITOPS_REF: b2bb34dfd3b68405ffa971f48b3263828c2bdfa8

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Fetch okdp-compiler next to the repository, at OKDP_COMPILER_REF
        run: |
          git init -q ../okdp-compiler
          git -C ../okdp-compiler remote add origin https://github.com/OKDP/okdp-compiler.git
          git -C ../okdp-compiler fetch -q --depth 1 origin "$OKDP_COMPILER_REF"
          git -C ../okdp-compiler checkout -q FETCH_HEAD
      - name: Fetch okdp-gitops next to the repository, at OKDP_GITOPS_REF
        run: |
          git init -q ../okdp-gitops
          git -C ../okdp-gitops remote add origin https://github.com/OKDP/okdp-gitops.git
          git -C ../okdp-gitops fetch -q --depth 1 origin "$OKDP_GITOPS_REF"
          git -C ../okdp-gitops checkout -q FETCH_HEAD
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: make test
      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...
