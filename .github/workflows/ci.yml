name: ci

# Pull request and branch CI: vet, test (make test) and govulncheck.

on:
  pull_request:
  push:
    branches: [main, no-kubocd]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOVULNCHECK_VERSION: v1.8.0   # needs Go 1.26 or later; go.mod is on 1.27 (okdp-compiler's)

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # go.mod replaces github.com/okdp/okdp-compiler with ../okdp-compiler until
      # it is published.
      - name: Clone okdp-compiler next to the repository
        run: git clone --depth 1 https://github.com/OKDP/okdp-compiler.git ../okdp-compiler
      # Likewise github.com/okdp/okdp-gitops with ../okdp-gitops.
      - name: Clone okdp-gitops next to the repository
        run: git clone --depth 1 https://github.com/OKDP/okdp-gitops.git ../okdp-gitops
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: make test
      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...
