name: ci

# Pull request and branch CI: vet, test (make test) and govulncheck.

on:
  pull_request:
  push:
    branches: [main, no-kubocd]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GOVULNCHECK_VERSION: v1.8.0   # needs Go 1.26 or later; go.mod is on 1.27 (okdp-compiler's)
  # go.mod replaces okdp-gitops with ../okdp-gitops until it is published: the
  # commit of OKDP/okdp-gitops the job builds with, a full SHA bumped by hand
  # (the same as build-image.yml's); its release replaces it, and the replace of go.mod
  # with it. okdp-compiler and cel2yaml are go.mod's releases.
  OKDP_GITOPS_REF: 852cd797174cd8572b7f644bf238c8c660abab1f

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Fetch okdp-gitops next to the repository, at OKDP_GITOPS_REF
        run: |
          git init -q ../okdp-gitops
          git -C ../okdp-gitops remote add origin https://github.com/OKDP/okdp-gitops.git
          git -C ../okdp-gitops fetch -q --depth 1 origin "$OKDP_GITOPS_REF"
          git -C ../okdp-gitops checkout -q FETCH_HEAD
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: go vet
        run: go vet ./...
      - name: go test
        run: make test
      - name: govulncheck
        run: go run "golang.org/x/vuln/cmd/govulncheck@${GOVULNCHECK_VERSION}" ./...
