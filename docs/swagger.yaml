        type: array
    type: object
host: localhost:8093
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: 'Minimal API server for OKDP UI New. Every answer carries an X-Request-Id
    header; a 500 (and a 502 of the SQL routes) answers {"error": <generic message>,
    "requestId": <id>}, its cause in the server''s log under that id. Every route
    needs a permission, deny by default, read from the platform''s own authority:
    platform admin (a group of platform.yaml global.okdp.access.admins) for the identity
    routes, the catalog''s writes and the creation and deletion of a project; a project
    role (project.yaml access, okdp-project-<p> an editor by default; a platform admin
    has every role) for the routes of /api/projects/{name}: viewer for its reads,
    editor for its writes, admin for its project.yaml. A caller without it answers
    403 {"error": <what it needs>, "code": "forbidden"}; GET /api/me tells what the
    caller may do.'
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: OKDP Server New API
  version: "1.0"
paths:
  /api/capabilities:
    get:
      description: Capabilities the platform is configured with (user management through
        Keycloak, console OIDC client, OIDC client provisioning backend), so the UI
        can adapt
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Capabilities'
      summary: Get platform capabilities
      tags:
      - capabilities
  /api/contracts:
    get:
      description: 'Descriptors of every contract, used to build the creation form,
        plus whether connections can currently be persisted (crdAvailable: true when
        the deployments repository is configured)'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.ConnectionCatalogResponse'
      summary: List the available contracts
      tags:
      - connections
  /api/me:
    get:
      description: 'The caller''s rights, read as every route reads them: whether
        it is a platform admin (a group of platform.yaml global.okdp.access.admins:
        identity, catalog writes, project creation and deletion) and its role in each
        project (project.yaml access, okdp-project-<p> an editor by default; a viewer
        reads, an editor writes, an admin edits project.yaml; a platform admin is
        admin everywhere). A project absent from projects is one the caller may not
        see. A route the caller may not use answers 403 {"error", "code": "forbidden"}'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CallerAccess'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: What the caller may do
      tags:
      - access
  /api/platform-categories:
    get:
      description: Get the ordered menu sections (key, label, icon, order) the console
        groups services under
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.MenuCategory'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List console navigation categories
      tags:
      - platform-services
  /api/platform-services:
    get:
      description: Get the list of managed OKDP services that can be deployed per
        project
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.PlatformService'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List available platform services
      tags:
      - platform-services
    post:
      consumes:
      - application/json
      description: Expose a service of the catalogs in the console menu (commits catalogs.yaml
        to the platform repository); its package must be in a catalog repository,
        its versions are the catalogs' (those given are checked, not stored)
      parameters:
      - description: Catalog service
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.PlatformService'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.PlatformService'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Add a service to the catalog
      tags:
      - platform-services
  /api/platform-services/{serviceName}:
    delete:
      description: Remove an exposed service from the catalog (commits catalogs.yaml
        to the deployments repository)
      parameters:
      - description: Service name
        in: path
        name: serviceName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Remove a catalog service
      tags:
      - platform-services
    put:
      consumes:
      - application/json
      description: Update an exposed service of the console menu (default, description,
        icon, category); its versions are the catalogs', those given are checked against
        them and not stored
      parameters:
      - description: Service name
        in: path
        name: serviceName
        required: true
        type: string
      - description: Catalog service
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.PlatformService'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.PlatformService'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a catalog service
      tags:
      - platform-services
  /api/platform-services/{serviceName}/inputs:
    get:
      parameters:
      - description: Service name
        in: path
        name: serviceName
        required: true
        type: string
      - description: Package version tag (defaults to the catalog default version)
        in: query
        name: tag
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.PackageInput'
            type: array
      summary: Connections a service's package declares it needs
      tags:
      - platform-services
  /api/platform-services/{serviceName}/schema:
    get:
      description: 'Returns the JSON Schema of the parameters (config.schema.json
        of the package catalog/<service>/<tag>/, global and connections removed; {"type":
        "object"} when the package has none) for a given service version'
      parameters:
      - description: Service name
        in: path
        name: serviceName
        required: true
        type: string
      - description: Package version tag (defaults to the catalog default version)
        in: query
        name: tag
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get JSON Schema for a platform service
      tags:
      - platform-services
  /api/platform-services/{serviceName}/versions:
    get:
      description: 'Returns the versions of the service''s package in the catalogs
        (the directories catalog/<service>/<version>/ of the repository of catalogs.yaml
        holding it), highest first, and the default: the menu entry''s, else the highest'
      parameters:
      - description: Service name
        in: path
        name: serviceName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/service.ServiceVersionsResponse'
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List available versions for a platform service
      tags:
      - platform-services
  /api/profile-images:
    get:
      description: Returns the list of available container images per profile type
        from the platform values (global.okdp.jupyter.profiles)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              items:
                $ref: '#/definitions/models.ProfileImage'
              type: array
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get available profile images
      tags:
      - platform-services
  /api/projects:
    get:
      consumes:
      - application/json
      description: 'List the projects declared in the deployments repository (projects/<p>/project.yaml),
        whether written by the console or by hand in Git, that the caller may see:
        those it has a role in (project.yaml access, okdp-project-<p> an editor by
        default), every one for a platform admin'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Project'
            type: array
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List the caller's projects
      tags:
      - projects
    post:
      consumes:
      - application/json
      description: 'Create a project: commits projects/<name>/project.yaml (in a split
        topology, to a new repository of its own, created through the Forgejo API
        with project.yaml only: no workflow, no secret, the CI of the output repository
        compiles it) and creates the project Namespace. 409 when the project is already
        declared, or when a Namespace of that name exists and is not a project''s'
      parameters:
      - description: Project Object
        in: body
        name: project
        required: true
        schema:
          $ref: '#/definitions/models.Project'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Project'
        "400":
          description: Invalid project name
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Project or Namespace already exists
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Create a project
      tags:
      - projects
  /api/projects/{name}:
    delete:
      consumes:
      - application/json
      description: 'Delete a project: removes projects/<name>/ from the deployments
        repository (the compile of that commit, okdp-gitops in CI, removes its compiled
        tree, and the GitOps engine uninstalls its releases), then its Namespace if
        the console created it'
      parameters:
      - description: Project Name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Delete a project
      tags:
      - projects
    get:
      consumes:
      - application/json
      description: Get a project declared in the deployments repository (projects/<name>/project.yaml)
      parameters:
      - description: Project Name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Project'
        "404":
          description: Project not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal server error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Get a project
      tags:
      - projects
    put:
      consumes:
      - application/json
      description: Update a project's mutable metadata (currently its description)
        in projects/<name>/project.yaml; the file's other keys are kept
      parameters:
      - description: Project Name
        in: path
        name: name
        required: true
        type: string
      - description: Project Object
        in: body
        name: project
        required: true
        schema:
          $ref: '#/definitions/models.Project'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Project'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Project not found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Update a project
      tags:
      - projects
  /api/projects/{name}/claims:
    get:
      description: 'The named claims of the project (claims.<name> of projects/<p>/project.yaml):
        each a connection of its contract, declared once, that every instance of the
        project naming it shares; with the provider the compile of the tree binds
        it to (its class, or the provider it names), the instances that name it, and
        why it does not bind'
      parameters:
      - description: Project name (= Kubernetes namespace)
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.NamedClaimView'
            type: array
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: List the named claims of a project
      tags:
      - claims
    post:
      consumes:
      - application/json
      description: 'Commits claims.<name> to the project''s project.yaml (its comments
        and other keys kept): a contract, a class of the project or the platform or
        a provider (<instance>, <release>, <namespace>/<instance> or <namespace>/<release>),
        and a request the contract''s claim schema allows (x-okdp-claim). Checked
        first (the class, the request), then by the compile of the tree: refused (400,
        code does-not-compile) when an instance that compiled no longer does'
      parameters:
      - description: Project name
        in: path
        name: name
        required: true
        type: string
      - description: The claim, its name included
        in: body
        name: claim
        required: true
        schema:
          $ref: '#/definitions/models.NamedClaimRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.NamedClaimView'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Project not found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: A named claim of that name exists
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
