basePath: /
definitions:
  models.BoundClaim:
    properties:
      binding:
        $ref: '#/definitions/models.ClaimBinding'
      contract:
        type: string
      field:
        description: |-
          Field is the parameter path of the reference (database,
          catalogs[1].storage).
        type: string
      granted:
        allOf:
        - $ref: '#/definitions/models.GrantedConnection'
        description: |-
          Granted is the connection the provider publishes for the claim, when
          it compiles.
      id:
        description: |-
          ID is the claim's ID, the name of the connection its provider
          publishes for it.
        type: string
      name:
        description: |-
          Name is the named claim the reference names; empty for a claim
          written in the parameters (a claim template).
        type: string
    type: object
  models.CallerAccess:
    properties:
      groups:
        description: Groups are the caller's groups, its token's groups claim.
        items:
          type: string
        type: array
      platformAdmin:
        description: 'PlatformAdmin: a member of a group of global.okdp.access.admins.'
        type: boolean
      projects:
        additionalProperties:
          type: string
        description: |-
          Projects maps each project the caller has a role in to it: viewer,
          editor or admin. A project absent has none: the caller does not see
          it.
        type: object
      username:
        description: Username is the caller's, from its token.
        type: string
    type: object
  models.Capabilities:
    properties:
      identity:
        $ref: '#/definitions/models.IdentityCapability'
      oidcProvisioning:
        $ref: '#/definitions/models.OidcProvisioningCapability'
    type: object
  models.ClaimBinding:
    properties:
      class:
        description: |-
          Class is the class whose provider it is; empty when the claim names
          its provider.
        type: string
      default:
        description: |-
          Default reports that the class is the default one of the contract
          (the claim names neither a class nor a provider).
        type: boolean
      instance:
        description: |-
          Instance is the provider's instance name, in the project Namespace
          (projects/<namespace>/instances/<instance>).
        type: string
      namespace:
        description: Namespace and Release are the provider's instance.
        type: string
      release:
        type: string
    type: object
  models.ClaimTemplate:
    properties:
      class:
        type: string
      provider:
        type: string
      request:
        additionalProperties: {}
        type: object
    type: object
  models.ClaimUser:
    properties:
      field:
        type: string
      instance:
        type: string
      namespace:
        type: string
      release:
        type: string
    type: object
  models.ConnectionCatalogResponse:
    properties:
      crdAvailable:
        description: |-
          CRDAvailable reports whether external connections can be persisted,
          which is whenever a deployments repository is configured (always, in a
          running server). The name is kept for API compatibility.
        type: boolean
      types:
        items:
          $ref: '#/definitions/models.ContractDescriptor'
        type: array
    type: object
  models.ConnectionConsumer:
    properties:
      effective:
        description: |-
          Effective reports that the connection exists (declared, or published by
          a deployed instance), as opposed to merely being named.
        type: boolean
      releaseName:
        type: string
      service:
        description: |-
          Service is the instance name as the console displays it, ReleaseName the
          Helm release (<project>-<instance>).
        type: string
      status:
        type: string
    type: object
  models.ConnectionField:
    properties:
      default: {}
      derived:
        allOf:
        - $ref: '#/definitions/models.FieldDerivation'
        description: |-
          Derived computes the value from another field instead of asking for it.
          The JDBC driver follows from the engine, and a form that lets the two
          disagree only produces connections nothing can open.
      help:
        type: string
      label:
        type: string
      masked:
        description: |-
          Masked hides the value as it is typed. A database user name lives in the
          Secret because the contract puts it there, but hiding it behind dots only
          stops the user from checking what they typed.
        type: boolean
      max:
        type: number
      min:
        type: number
      name:
        type: string
      options:
        items:
          type: string
        type: array
      placeholder:
        type: string
      required:
        type: boolean
      secret:
        description: |-
          Secret says where the value is stored: in the credentials Secret rather
          than in the connection's entry. It says nothing about how it is typed in.
        type: boolean
      showWhen:
        allOf:
        - $ref: '#/definitions/models.FieldCondition'
        description: |-
          ShowWhen limits the field to one value of another field. A PostgreSQL TLS
          mode and a MySQL one are not the same list, and offering both at once is
          how a connection ends up carrying the wrong one.
      type:
        type: string
    type: object
  models.ConnectionRequest:
    properties:
      description:
        type: string
      existingSecret:
        description: |-
          ExistingSecret names a Secret already present in the namespace, holding
          the credentials of this connection. When it is set the server stores no
          credential of its own: the Secret may come from anywhere, typically
          projected from a vault by External Secrets, and the connection only
          points at it. The credential fields of the payload are then ignored.
        type: string
      name:
        type: string
      type:
        type: string
      values:
        additionalProperties: {}
        type: object
    required:
    - name
    - type
    - values
    type: object
  models.ConnectionResponse:
    properties:
      createdAt:
        type: string
      credentialsSecret:
        allOf:
        - $ref: '#/definitions/models.CredentialsSecretRef'
        description: |-
          CredentialsSecret is the Secret holding the secret fields, so a consumer
          can reference it from a Deployment without the console ever reading it.
      description:
        type: string
      message:
        type: string
      name:
        type: string
      namespace:
        type: string
      scope:
        type: string
      secretFields:
        items:
          type: string
        type: array
      status:
        type: string
      type:
        type: string
      values:
        additionalProperties: {}
        type: object
    type: object
  models.ConnectionTestCheck:
    properties:
      decisive:
        description: |-
          Decisive marks the path a workload will actually take, the one Success
          reflects. The others are shown for diagnosis.
        type: boolean
      label:
        description: Label names the path for a reader ("In-cluster URL", "Public
          URL").
        type: string
      message:
        type: string
      reason:
        type: string
      success:
        type: boolean
      target:
        type: string
    type: object
  models.ConnectionTestRequest:
    properties:
      type:
        type: string
      values:
        additionalProperties: {}
        type: object
    required:
    - type
    - values
    type: object
  models.ConnectionTestResult:
    properties:
      checks:
        items:
          $ref: '#/definitions/models.ConnectionTestCheck'
        type: array
      durationMs:
        type: integer
      message:
        type: string
      reason:
        type: string
      success:
        type: boolean
    type: object
  models.Container:
    properties:
      image:
        type: string
      name:
        type: string
      ready:
        type: boolean
    type: object
  models.ContractClasses:
    properties:
      claimSchema:
        additionalProperties: {}
        description: |-
          ClaimSchema is what a claim may request (the contract's x-okdp-claim,
          a JSON Schema); nil when the contract takes no request.
        type: object
      classes:
        items:
          $ref: '#/definitions/models.ProvisioningClass'
        type: array
      contract:
        type: string
      default:
        description: |-
          Default is the default class, of the claims that name neither a class
          nor a provider; empty when there is none (such a claim is refused).
        type: string
      defaultLevel:
        description: DefaultLevel is where the default is set.
        type: string
    type: object
  models.ContractDescriptor:
    properties:
      category:
        type: string
      claimSchema:
        additionalProperties: {}
        description: |-
          ClaimSchema is what a claim of the contract may request of the
          instance that provisions it (x-okdp-claim, a JSON Schema: a database's
          extensions, a bucket's paths), nil when the contract takes no request.
        type: object
      description:
        type: string
      displayName:
        type: string
      endpointFrom:
        description: |-
          EndpointFrom names the value fields carrying the address a consumer would
          reach, most specific first. A contract publishing a plain host and port
          needs none: that convention is the fallback.
        items:
          type: string
        type: array
      external:
        description: |-
          External reports whether a user may declare a connection against this
          contract by hand. A contract that is not external is listed for the
          internal view, where the connections come from the deployed services,
          but offers no creation form.
        type: boolean
      fields:
        description: |-
          Fields are the connection's fields, what a provider publishes (the
          contract's properties). An instance's output of any contract is
          selectable, by its name: no connection is computed from a name.
        items:
          $ref: '#/definitions/models.ConnectionField'
        type: array
      icon:
        type: string
      name:
        description: |-
          Name IS the contract this descriptor produces (x-okdp-connection-ref).
          One descriptor, one contract, deliberately: an entry form that produced a
          differently named contract would mean nothing a chart asks for could be
          found by its own name.
        type: string
    type: object
  models.CredentialsSecretRef:
    properties:
      keys:
        items:
          type: string
        type: array
      name:
        type: string
      namespace:
        type: string
      owned:
        description: |-
          Owned reports that the console wrote this Secret, as opposed to pointing
          at one that was already there, typically projected from a vault. The two
          behave differently on edit and on delete, so the panel says which it is.
        type: boolean
    type: object
  models.ExecutorDefaults:
    properties:
      cores:
        type: integer
      instances:
        type: integer
      memory:
        type: string
    type: object
  models.ExternalSecretDataEntry:
    properties:
      remoteRef:
        $ref: '#/definitions/models.ExternalSecretRemote'
      secretKey:
        type: string
    required:
    - remoteRef
    - secretKey
    type: object
  models.ExternalSecretRemote:
    properties:
      key:
        type: string
      property:
        type: string
    required:
    - key
    type: object
  models.ExternalSecretRequest:
    properties:
      data:
        items:
          $ref: '#/definitions/models.ExternalSecretDataEntry'
        type: array
      name:
        type: string
      refreshInterval:
        type: string
      secretStoreRef:
        type: string
      target:
        $ref: '#/definitions/models.ExternalSecretTarget'
    required:
    - data
    - refreshInterval
    - secretStoreRef
    - target
    type: object
  models.ExternalSecretResponse:
    properties:
      createdAt:
        type: string
      data:
        items:
          $ref: '#/definitions/models.ExternalSecretDataEntry'
        type: array
      lastError:
        type: string
      lastSyncedAt:
        type: string
      name:
        type: string
      namespace:
        type: string
      refreshInterval:
        type: string
      secretStoreRef:
        type: string
      status:
        type: string
      target:
        $ref: '#/definitions/models.ExternalSecretTargetResponse'
    type: object
  models.ExternalSecretStatusResponse:
    properties:
      conditions:
        items:
          $ref: '#/definitions/models.SecretStoreCondition'
        type: array
      lastError:
        type: string
      lastSyncedAt:
        type: string
      status:
        type: string
    type: object
  models.ExternalSecretTarget:
    properties:
      name:
        type: string
    required:
    - name
    type: object
  models.ExternalSecretTargetResponse:
    properties:
      creationPolicy:
        type: string
      name:
        type: string
    type: object
  models.FieldCondition:
    properties:
      field:
        type: string
      value:
        type: string
    type: object
  models.FieldDerivation:
    properties:
      from:
        type: string
      map:
        additionalProperties:
          type: string
        type: object
    type: object
  models.GrantedConnection:
    properties:
      secretRef:
        type: string
      values:
        additionalProperties: {}
        type: object
    type: object
  models.Group:
    properties:
      comment:
        type: string
      description:
        description: Alias for Comment if needed
        type: string
      name:
        type: string
    type: object
  models.IdentityCapability:
    properties:
      oidc:
        allOf:
        - $ref: '#/definitions/models.IdentityOidcConfig'
        description: |-
          Oidc is the OIDC client the console UI should authenticate with,
          resolved from the platform values (global.okdp.identity.oidc). Absent when the platform
          does not publish it: the UI falls back to its build-time configuration.
      provider:
        description: |-
          Provider is who manages the platform users: "keycloak" when this server
          manages them through the Keycloak Admin API, "external" otherwise
          (users are managed in Keycloak directly).
        type: string
      userManagement:
        description: |-
          UserManagement is true when the user/group management API
          (/api/v1/identity) is available: the server has Keycloak admin
          credentials and a realm to apply them to.
        type: boolean
    type: object
  models.IdentityOidcConfig:
    properties:
      authority:
        description: Authority is the OIDC issuer the UI redirects to.
        type: string
      clientId:
        description: ClientID is the public (PKCE) client registered for the console.
        type: string
      scope:
        description: Scope overrides the UI default scopes when set.
        type: string
    type: object
  models.InstanceClaims:
    properties:
      bound:
        description: Bound are the claims of the instance's references.
        items:
          $ref: '#/definitions/models.BoundClaim'
        type: array
      error:
        description: |-
          Error is why the instance does not compile, the compiler's message:
          its claims are then unknown.
        type: string
      provided:
        description: Provided are the claims bound to the instance, as a provider.
        items:
          $ref: '#/definitions/models.ProvidedClaim'
        type: array
      provisions:
        description: |-
          Provisions are the contracts the instance's package provisions
          (okdp.yaml provisions).
        items:
          type: string
        type: array
    type: object
  models.InternalConnection:
    properties:
      category:
        type: string
      createdAt:
        type: string
      endpoint:
        description: Endpoint is the in-cluster address another service uses to reach
          it.
        type: string
      host:
        type: string
      icon:
        type: string
      managed:
        description: |-
          Managed reports that the entry is published by a deployed instance (its
          descriptor's outputs), not declared by hand. Always true here.
        type: boolean
      name:
        type: string
      namespace:
        type: string
      port:
        type: integer
      releaseName:
        type: string
      service:
        description: Service and ReleaseName identify the deployed instance providing
          it.
        type: string
      status:
        type: string
      type:
        type: string
      typeDisplay:
        type: string
      values:
        additionalProperties: {}
        type: object
    type: object
  models.MenuCategory:
    properties:
      icon:
        type: string
      key:
        type: string
      label:
        type: string
      order:
        type: integer
    type: object
  models.MetricValue:
    properties:
      available:
        type: boolean
      limit:
        type: string
      limitRaw:
        type: number
      pct:
        type: number
      used:
        type: string
      usedRaw:
        type: number
    type: object
  models.NamedClaimRequest:
    properties:
      class:
        type: string
      contract:
        type: string
      name:
        description: Name is the claim's name, on creation (the path gives it on update).
        type: string
      provider:
        type: string
      request:
        additionalProperties: {}
        type: object
    required:
    - contract
    type: object
  models.NamedClaimView:
    properties:
      binding:
        allOf:
        - $ref: '#/definitions/models.ClaimBinding'
        description: |-
          Binding is where the compile of the project's sources binds it; nil
          when it does not bind (Error says why) or no instance compiles.
      class:
        description: |-
          Class names a class of the contract (the project's or the
          platform's); empty with Provider, or for the default class.
        type: string
      contract:
        description: Contract is the contract of its connection (database-server,
          s3).
        type: string
      error:
        description: Error is why the claim does not bind, the compiler's message.
        type: string
      id:
        description: |-
          ID is the claim's ID, <project>.<name>: the name of the connection
          its provider publishes for it.
        type: string
      name:
        description: Name is the claim's name, a DNS-1123 label, no connection's name.
        type: string
      provider:
        description: |-
          Provider names the provider's instance, by its name or its release, of
          the project or <namespace>/<instance>; never with Class.
        type: string
      request:
        additionalProperties: {}
        description: |-
          Request is what it requests of its provider, as the contract's claim
          schema allows (x-okdp-claim).
        type: object
      users:
        description: Users are the instances of the project whose parameters name
          it.
        items:
          type: string
        type: array
    type: object
  models.OidcProvisioningCapability:
    properties:
      provider:
        description: |-
          Provider is the configured provisioning backend: "none" (default) or
          "keycloak".
        type: string
    type: object
  models.PackageInput:
    properties:
      alias:
        description: |-
          Alias names the input in the package's templates, and is the key the
          console sends back when the user picks a connection.
        type: string
      contract:
        description: |-
          Contract names the contract the chosen connection must satisfy. It is what
          makes the choice safe: only connections of that contract are offered.
        type: string
      default:
        description: |-
          Default is the connection the chart falls back to when the deployer picks
          nothing (the property's schema default). The console must leave the
          parameter out rather than send an empty string, which would win over it.
        type: string
      defaultClaim:
        allOf:
        - $ref: '#/definitions/models.ClaimTemplate'
        description: |-
          DefaultClaim is set when the default is a claim, the package's claim
          template ({} for a connection of its own of the default class): the
          parameter left out claims it.
      description:
        description: Description is shown next to the field.
        type: string
      optional:
        description: Optional reports that the package tolerates no connection at
          all.
        type: boolean
      parameter:
        description: |-
          Parameter is the root chart parameter carrying the chosen connection
          name (the property marked x-okdp-connection-ref). Empty for a ref nested
          in an object or a list, which the form fills inside that structure.
        type: string
      path:
        description: |-
          Path is the JSON path of the marked property: "metadataDb" at the root,
          "hiveCatalogs[].metastore" inside the items of a list.
        type: string
      provision:
        description: |-
          Provision reports that the reference takes a claim (a map in place of
          a name: {}, {class}, {provider}, with a request) or a named claim of
          the project (x-okdp-connection-ref's provision).
        type: boolean
      request:
        additionalProperties: {}
        description: |-
          Request is what the package fixes of the request of every claim of
          the reference, the instance's merged over it.
        type: object
      require:
        additionalProperties: {}
        description: |-
          Require is what the package requires of the connection beyond its
          contract, a JSON Schema (x-okdp-connection-ref's require).
        type: object
    type: object
  models.PlatformService:
    properties:
      category:
        type: string
      defaultVersion:
        type: string
      description:
        type: string
      exposesUI:
        description: |-
          ExposesUI is false for infrastructure-only packages (operators, storage
          backends) that have no console page, and nil when the catalog does not set
          it, which the console treats as exposing a UI. It lets the catalog-driven
          menu leave purely infrastructural packages out of the navigation.
        type: boolean
      icon:
        type: string
      label:
        description: |-
          Label is the display name shown in the console menu; the service `name`
          (its identity and route) is used when empty.
        type: string
      name:
        type: string
      repository:
        description: |-
          Repository names the catalog repository holding the service's package
          (platform/catalog.yaml repositories[].name). Read only: ignored on a
          write.
        type: string
      versions:
        items:
          type: string
        type: array
    type: object
  models.Pod:
    properties:
      age:
        type: string
      containers:
        items:
          $ref: '#/definitions/models.Container'
        type: array
      name:
        type: string
      ready:
        type: string
      restarts:
        type: integer
      status:
        type: string
    type: object
  models.ProfileImage:
    properties:
      image:
        type: string
      label:
        type: string
    type: object
  models.Project:
    properties:
      description:
        type: string
      name:
        type: string
    type: object
  models.ProvidedClaim:
    properties:
      claimers:
        description: |-
          Claimers are the instances whose references claim it: one for a claim
          template, every instance that names a named claim.
        items:
          $ref: '#/definitions/models.ClaimUser'
        type: array
      class:
        description: |-
          Class is the class the claim binds through, empty when it names its
          provider; Default reports the default class.
        type: string
      contract:
        type: string
      default:
        type: boolean
      granted:
        allOf:
        - $ref: '#/definitions/models.GrantedConnection'
        description: |-
          Granted is the connection the provider publishes for the claim (its
          okdp.info.yaml), nil when it publishes none.
      id:
        type: string
      name:
        description: Name is a named claim's name, empty for a claim template.
        type: string
      namespace:
        description: Namespace is the claimers' namespace.
        type: string
    type: object
  models.ProvisioningClass:
    properties:
      level:
        description: |-
          Level is where the class is defined: platform (platform.yaml)
          or project (the project's project.yaml).
        type: string
      name:
        type: string
      provider:
        description: |-
          Provider is the provider's instance, <release> of the claimer's
          project or <namespace>/<release>.
        type: string
      request:
        additionalProperties: {}
        description: |-
          Request is what the class fixes of the request of its claims: a claim
          that sets one of its keys is refused.
        type: object
    type: object
  models.ProvisioningResponse:
    properties:
      contracts:
        items:
          $ref: '#/definitions/models.ContractClasses'
        type: array
    type: object
  models.RenderedValues:
    properties:
      changedLines:
        description: |-
          ChangedLines are the 1-based lines of Values that differ from Defaults:
          set by OKDP or the instance; the others come from the chart's
          defaults. Empty when nothing differs or when the defaults could not be
          read.
        items:
          type: integer
        type: array
      chart:
        description: Chart is the chart that renders them (its name in its Chart.yaml).
        example: trino
        type: string
      chartVersion:
        description: ChartVersion is that chart, <name>-<version>.
        example: trino-1.42.2
        type: string
      defaults:
        description: |-
          Defaults is the chart's own values.yaml, as published (with its
          comments), from the chart cache. Empty when it could not be read (see
          DefaultsError).
        type: string
      defaultsError:
        description: DefaultsError says why the defaults are missing.
        type: string
      name:
        description: |-
          Name is the chart key (the umbrella's dependency alias, else its name),
          or the chart of a plain chart instance.
        example: trino
        type: string
      serviceVersion:
        description: |-
          ServiceVersion is the version of the instance's package (or plain
          chart) the values were compiled for.
        example: 480.0.0-1.0.2
        type: string
      values:
        description: |-
          Values is what Helm renders the chart with: its defaults coalesced
          under the compiled values (instance.values.yaml of the compiled
          directory, the key's; values.yaml for a plain chart). The compiled
          values only when the defaults cannot be read (DefaultsError).
        type: string
    type: object
  models.ResourceDefaults:
    properties:
      cores:
        type: integer
      memory:
        type: string
    type: object
  models.SecretAuthConfig:
    properties:
      mountPath:
        type: string
      role:
        type: string
      serviceAccount:
        description: |-
          ServiceAccount names the account the store authenticates as under
          Kubernetes auth, so a project can give its store its own identity
          instead of the default account every workload in the namespace shares.

          A pointer, because on update three intents must stay apart: absent keeps
          the account already in use, an empty string asks for the default account
          back, and a name selects that account. A plain string merges the first
          two, which leaves no way to return to the default once a name is set.
        type: string
      token:
        type: string
    type: object
  models.SecretAuthConfigSafe:
    properties:
      mountPath:
        type: string
      role:
        type: string
      serviceAccount:
        description: Nil for token auth, which has no service account to report.
        type: string
    type: object
  models.SecretStoreAuth:
    properties:
      config:
        $ref: '#/definitions/models.SecretAuthConfig'
      type:
        type: string
    required:
    - config
    - type
    type: object
  models.SecretStoreAuthResponse:
    properties:
      config:
        $ref: '#/definitions/models.SecretAuthConfigSafe'
      type:
        type: string
    type: object
