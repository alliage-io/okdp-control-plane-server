  /api/projects/{name}/connections/{connName}/sql:
    post:
      consumes:
      - application/json
      description: 'Runs a statement on a database-server connection (engine postgresql)
        declared in the tree: the project''s, else the platform''s, else a named claim
        of the project (the connection its provider granted). Host, port and database
        are the connection''s, never the request''s. The credentials come only from
        the claim''s provisioned Secret (labelled okdp.io/credentials-database-server),
        the platform''s secret store (secretRef.remoteKey, the Secret an ExternalSecret
        of the project fills from it), the Secret the console wrote from the connection
        form, or a Secret labelled okdp.io/connection-credentials: "true"; any other
        answers 400 (code sql-credentials-refused). Every project member acts as the
        connection''s database user. TLS is always verified against the platform CA
        bundle (sslMode verify-ca checks the chain only; disable and prefer are not
        honored): 502 (code sql-tls-unverified) otherwise. Only SCRAM-SHA-256 authentication:
        a server asking for a clear-text or MD5 password answers 502 (code sql-auth-method-refused).
        Loopback, link-local and Kubernetes API server addresses answer 400 (code
        sql-address-refused) unless SQL_ALLOWED_NETWORKS allows them. Read-only by
        default: one statement, in a READ ONLY transaction rolled back after it (a
        batch of several is an SQL error, 42601). With `write: true`, a batch: several
        statements separated by '';'' run in one implicit transaction; the result
        is the last statement that returned columns, with the command tag of the last
        statement. Every statement is logged with the caller and the connection. Rows
        past maxRows (at most SQL_MAX_ROWS) or SQL_MAX_RESULT_BYTES are dropped (not
        cancelled). SQL errors (errorName = SQLSTATE) and the statement timeout (SQL_STATEMENT_TIMEOUT,
        2 minutes) answer 200 with `error` set. 429 (code sql-busy): the caller already
        runs SQL_MAX_CONCURRENT_PER_USER statements. 400 (code sql-claim-unbound):
        a named claim no provider granted yet. Any other failure of the database answers
        502 with a generic message and the requestId, its cause in the server''s log.'
      parameters:
      - description: Project name
        in: path
        name: name
        required: true
        type: string
      - description: Connection name
        in: path
        name: connName
        required: true
        type: string
      - description: SQL Query Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.SqlQueryRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.SqlQueryResult'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "429":
          description: Too Many Requests
          schema:
            additionalProperties:
              type: string
            type: object
        "502":
          description: Bad Gateway
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Execute SQL on a database connection
      tags:
      - sql
